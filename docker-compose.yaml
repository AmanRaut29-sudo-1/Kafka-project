version: '3.8' # Specify the Docker Compose file format version

services:
  kafka: # Kafka service configuration
    image: confluentinc/cp-kafka:7.8.10 # Use the Confluent Kafka image for better compatibility and features
    container_name: kafka
    ports:
      - "9092:9092"

    environment:
      KAFKA_KRAFT_MODE: "true" # Enable KRaft mode for Kafka, which eliminates the need for Zookeeper
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "kafka-cluster" # Set a unique cluster ID for the Kafka cluster

      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1


      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOGS_DIRS: /tmp/kraft-combined-logs

    volumes:
      - kafka_kraft:/var/lib/kafka/data

volumes:
  kafka_kraft: # Named volume for Kafka logs